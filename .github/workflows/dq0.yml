name: Research Pipeline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dq0.yml'
      - 'scripts/**'
      - 'MODEL_V1.md'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pyarrow numpy scipy
      - run: python scripts/run_dq0.py
      - run: python scripts/run_s1.py
      - run: python scripts/run_s2.py
      - run: python scripts/run_s3.py
      - run: python scripts/run_s4.py
      - run: python scripts/run_s5.py
      - run: python scripts/run_v1.py
      - run: python scripts/run_v2.py
      - run: python scripts/run_v3.py
      - run: python scripts/run_v4.py
      - run: python scripts/run_v5.py
      - run: python scripts/run_v6.py
      - run: python scripts/run_v7.py
      - name: Publish V1 ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/v1_current_ranking.csv outputs/v1_current_ranking.json outputs/v2_current_ranking.csv outputs/v2_current_ranking.json outputs/v3_backtest_monthly.csv outputs/v3_backtest_summary.json outputs/v4_risk_metrics.csv outputs/v4_annual_returns.csv outputs/v4_risk_summary.json outputs/v5_portfolio_comparison.csv outputs/v5_summary.json outputs/v6_regime_comparison.csv outputs/v6_monthly.csv outputs/v6_summary.json outputs/v7_walkforward.csv outputs/v7_summary.json
          git diff --cached --quiet || git commit -m "Publish latest V1 ranking"
          git push
      - uses: actions/upload-artifact@v4
        with: {name: research-results,path: outputs/}
