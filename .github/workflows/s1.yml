name: S1 Technical Selection Baseline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/s1.yml'
      - 'scripts/run_s1.py'
jobs:
  s1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pyarrow numpy
      - run: python scripts/run_s1.py
      - uses: actions/upload-artifact@v4
        with: {name: s1-results,path: outputs/}
